<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='cadastro_usuario.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="static/assents/img/favicon.png" type="image/png">
</head>

<body class="bg-secondary">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <h3 class="text-white">Vamos fazer o seu cadastro!?</h3>
        <a class="navbar-brand" href="#"></a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">

            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2" href="{{ url_for('index') }}">
                <i class="fa-solid fa-house"></i> Início
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2" href="{{ url_for('pagina_aberturas') }}">
                <i class="fa-solid fa-chess-board"></i>
                Acesse as aberturas
              </a>
            </li>

          <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2" href="{{ url_for('pagina_favoritos') }}">
                <i class="fa-solid fa-star"></i> Favoritos
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2" href="{{ url_for('cadastro_abertura') }}">
                <i class="fa-solid fa-chess"></i> Cadastro Abertura
              </a>
            </li>

          </ul>

        </div>

      </div>
</nav>

<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">

      <form method="POST" class="bg-light p-4 rounded shadow">

        <h1 class="text-center mb-4">Cadastro</h1>

        <div class="mb-3">
          <input type="text"
                 name="nome_user"
                 class="form-control"
                 placeholder="Nome"
                 required>
        </div>

        <div class="mb-3">
          <input type="email"
                 name="Email_do_User"
                 class="form-control"
                 placeholder="Email"
                 required>
        </div>

        <div class="mb-3">
          <input type="password"
                 name="Senha"
                 class="form-control"
                 placeholder="Senha"
                 required>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary">
            Confirmar
          </button>
        </div><br>
        <div class="d-grid">
            <a class="btn btn-primary" href="{{ url_for('login_usuario') }}">
                Faça o login
            </a>
        </div>
      </form>

    </div>
  </div>
</main>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
